name: Commit messages

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
