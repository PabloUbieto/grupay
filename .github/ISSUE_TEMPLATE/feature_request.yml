name: ✨ Feature request
description: Propose a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's included and what's not
  - type: textarea
    id: questions
    attributes:
      label: Open questions
